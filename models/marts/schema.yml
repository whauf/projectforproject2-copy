version: 2

# "Run time" below = max(fetched_at) across the raw tables (macros/run_time.sql).

models:
  - name: fct_pull_requests
    description: >
      One row per PR created on or after the window start (2024-01-01). PRs still open at run
      time are kept and marked is_open; their merge/close durations are NULL, so medians of
      those durations cover finished PRs only.
    columns:
      - name: repo
        description: "Repository as owner/name."
        data_tests: [not_null]
      - name: pr_number
        description: "PR number."
        data_tests: [not_null]
      - name: pr_key
        description: "Primary key: repo + '#' + pr_number."
        data_tests: [unique, not_null]
      - name: author_login
        description: "Login of the PR author."
      - name: is_bot_author
        description: "Bot rule applied to the PR author."
      - name: state
        description: "GitHub state: open or closed."
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'closed']
      - name: pr_status
        description: "merged, closed_unmerged, or open (at run time)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['merged', 'closed_unmerged', 'open']
      - name: created_at
        description: "PR creation time (UTC)."
      - name: updated_at
        description: "Last activity on the PR (UTC)."
      - name: closed_at
        description: "Close time, merged or not (NULL while open)."
      - name: merged_at
        description: "Merge time (NULL unless merged)."
      - name: is_merged
        description: "merged_at IS NOT NULL."
      - name: is_closed_unmerged
        description: "state = 'closed' AND merged_at IS NULL."
      - name: is_open
        description: "state = 'open' at run time."
      - name: first_review_at
        description: "min(submitted_at) over reviews of this PR, excluding reviews by the PR author and by bots."
      - name: hours_to_first_review
        description: "Hours from created_at to first_review_at; NULL if never reviewed."
      - name: reviewed_within_7d
        description: "hours_to_first_review <= 168; false if never reviewed."
      - name: hours_to_merge
        description: "Hours from created_at to merged_at; NULL unless merged."
      - name: hours_to_close
        description: "Hours from created_at to closed_at, merged or not; NULL if open."
      - name: is_stale
        description: "is_open AND updated_at < run time - 180 days."
      - name: has_approving_review
        description: "Any non-author, non-bot review with state APPROVED."
      - name: review_count
        description: "Number of non-author, non-bot reviews."
      - name: is_older_than_7d
        description: "Created at least 7 days before run time (eligible for the 7-day review share)."
      - name: run_time
        description: "Run time used for is_stale and is_older_than_7d."

  - name: fct_releases
    description: "One row per published (non-draft) release on or after the window start."
    columns:
      - name: repo
        description: "Repository as owner/name."
        data_tests: [not_null]
      - name: release_id
        description: "Release id."
        data_tests: [not_null]
      - name: release_key
        description: "Primary key: repo + ':' + release_id."
        data_tests: [unique, not_null]
      - name: tag_name
        description: "Git tag of the release."
      - name: release_name
        description: "Release title."
      - name: published_at
        description: "Publish time (UTC)."
        data_tests: [not_null]
      - name: is_prerelease
        description: "True for pre-releases."
      - name: days_since_previous
        description: "Days since the repo's previous release (lag computed before the window filter)."

  - name: mart_repo_monthly
    description: "Repo x month, January 2024 through the run month, built on a month spine so quiet months show 0."
    data_tests:
      - unique:
          arguments:
            column_name: "repo || '|' || month"
    columns:
      - name: repo
        description: "Repository as owner/name."
        data_tests: [not_null]
      - name: month
        description: "First day of the month."
        data_tests: [not_null]
      - name: month_index
        description: "Months since the window start (0 = January 2024); x-axis for trend slopes."
      - name: prs_opened
        description: "PRs created this month (by created_at)."
      - name: prs_merged
        description: "PRs merged this month (by merged_at)."
      - name: prs_closed_unmerged
        description: "PRs closed without merge this month (by closed_at)."
      - name: merge_ratio
        description: "prs_merged / (prs_merged + prs_closed_unmerged); NULL when the denominator is 0."
      - name: median_first_review_hours
        description: "Median hours_to_first_review of PRs opened this month (unreviewed PRs are NULL and fall out)."
      - name: median_merge_hours
        description: "Median hours_to_merge of PRs merged this month."
      - name: commits
        description: "Commits authored this month (by committed_at)."
      - name: bot_commits
        description: "Commits by bot authors this month."
      - name: active_contributors
        description: "Distinct non-bot PR authors who opened a PR this month."
      - name: releases
        description: "Releases published this month."
      - name: is_partial_month
        description: "True for the run month, which is not over yet."

  - name: mart_repo_weekly
    description: >
      Repo x week (Monday start) of commit counts. Flags weeks beyond the repo's outlier fence
      (Q3 + 3 x IQR of its complete weeks) and caps them for the scored commit trend.
    data_tests:
      - unique:
          arguments:
            column_name: "repo || '|' || week"
    columns:
      - name: repo
        description: "Repository as owner/name."
        data_tests: [not_null]
      - name: week
        description: "Monday of the week."
        data_tests: [not_null]
      - name: week_index
        description: "Weeks since the window start (0 = the week of 2024-01-01); x-axis for the commit trend."
      - name: commits
        description: "Commits authored this week."
      - name: bot_commits
        description: "Commits by bot authors this week."
      - name: commit_authors
        description: "Distinct linked commit authors this week."
      - name: is_partial_week
        description: "True for the run week."
      - name: commit_fence
        description: "The repo's outlier fence for weekly commits: Q3 + 3 x IQR over its complete weeks."
      - name: is_commit_outlier
        description: "Complete week with more commits than the fence."
      - name: commits_capped
        description: "least(commits, commit_fence): the weekly count used by the scored commit trend."

  - name: mart_health_inputs
    description: >
      One row per repo with every metric scored in Task 5. Every column is a rate, share,
      median, or slope, never a raw count.
    columns:
      - name: repo
        description: "Repository as owner/name."
        data_tests: [unique, not_null]
      - name: commits_per_week
        description: "Commits in the window / (days in window / 7). Descriptive only, not scored (volume)."
      - name: commit_trend
        description: "regr_slope(commits, month_index) over complete months: commits per month gained each month."
      - name: commit_growth_per_year
        description: "OLS slope of capped weekly commits x 52 / mean capped weekly commits: yearly growth relative to the repo's own size. Higher is healthier."
      - name: median_hours_to_first_review
        description: "Median hours to first non-author, non-bot review over reviewed PRs. Lower is healthier."
      - name: pct_reviewed_within_7d
        description: "Share of PRs created at least 7 days before run time that were reviewed within 7 days. Higher is healthier."
      - name: merge_rate
        description: "Merged / (merged + closed unmerged) over PRs created in the window. Higher is healthier."
      - name: median_hours_to_merge
        description: "Median hours from creation to merge over merged PRs. Lower is healthier."
      - name: pct_open_stale
        description: "Share of open PRs with no update in 180+ days. Lower is healthier."
      - name: releases_per_year
        description: "Published releases in the window / (days in window / 365.25). Higher is healthier."
      - name: top5_author_share
        description: "Share of merged PRs written by the five most prolific human authors. Lower is healthier."
      - name: contributor_growth_per_year
        description: "Slope of monthly active PR authors x 12 / mean monthly authors. Higher is healthier."
      - name: run_time
        description: "Run time the metrics were computed against."
