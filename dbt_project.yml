name: 'package_health'
version: '1.0.0'
profile: 'package_health'
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false

vars:
  # Fixed start of the analysis window (the flow passes the same value from pipeline/config.py).
  window_start: '2024-01-01'

models:
  package_health:
    staging:
      +materialized: view
    marts:
      +materialized: table
